<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara gedicht.</title>
    <style>
        body {
            display: flex;
            justify-content: center;
        }
        .container {
            width: 80%;
            margin: 10px;
            display: flex;
            justify-content: center;
            justify-items: center;
            flex-direction: column;
        }
        .container * {
            width: auto;
            margin: 5px;
            text-align: center;
            background-color: gainsboro;
        }

        .box {
            box-shadow: 10px 10px darkgray;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/U-x9essb8rE?si=jA-I0xYgM0NEtdgr" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen class="box"></iframe>
        <div class="box">
            <h1>Een tandenborstel</h1>
            <p>voor een schoon gebit,<br>
                voor deze Sara met veel pit.<br>
                Je leeftijd valt er niet mee weg te boenen,<br>
                gelukkig ben je nog steeds om te zoene! 
            </p>
        </div>
    </div>
</body>
</html>
